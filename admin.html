<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#484848">
  <title>慶壽喜燒｜候位管理後台</title>
  <style>
    :root{--dark:#484848;--light:#b0b2be;--paper:#f4f4f6;--white:#fff;--ink:#303136;--muted:#6c6e77;--line:#dedfe4;--ok:#2f7554;--warn:#a8681f;--danger:#a43b31;--shadow:0 16px 40px rgba(72,72,72,.12)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}
    header{background:var(--dark);color:#fff;padding:18px clamp(18px,4vw,54px);display:flex;align-items:center;justify-content:space-between;gap:24px}.identity{display:flex;align-items:center;gap:15px}.identity img{width:58px;height:58px}.identity strong{display:block;font-size:18px}.identity span{display:block;font-size:13px;color:rgba(255,255,255,.66)}.header-actions{display:flex;align-items:center;gap:12px}.sync{font-size:13px;color:rgba(255,255,255,.7)}
    main{width:min(1180px,calc(100% - 32px));margin:32px auto 60px}.toolbar{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:22px}.toolbar h1{font-size:32px;margin:0 0 4px}.toolbar p{margin:0;color:var(--muted)}
    .button{border:0;border-radius:4px;padding:10px 14px;font-weight:700;background:var(--dark);color:#fff}.button.light{background:var(--light);color:var(--dark)}.button.ghost{background:#fff;color:var(--dark);border:1px solid var(--line)}.button.danger{background:#fff;color:var(--danger);border:1px solid #e8c7c3}.button.small{padding:7px 10px;font-size:13px}.button:disabled{opacity:.45;cursor:not-allowed}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);padding:18px 20px}.stat span{display:block;color:var(--muted);font-size:13px}.stat strong{display:block;font-size:28px;margin-top:4px}
    .settings{background:#fff;border:1px solid var(--line);padding:18px 20px;margin-bottom:20px;display:flex;align-items:end;gap:14px;flex-wrap:wrap}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{border:1px solid var(--line);border-radius:4px;background:#fff;padding:9px 11px;min-width:130px}.field input:focus,.field select:focus{outline:3px solid rgba(176,178,190,.38);border-color:var(--dark)}
    .panel{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panel-head h2{font-size:18px;margin:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th,td{text-align:left;padding:14px 12px;border-bottom:1px solid #ececf0;vertical-align:middle}th{font-size:12px;color:var(--muted);letter-spacing:.04em;background:#fafafd}td{font-size:14px}.ticket{font-family:Georgia,serif;color:var(--dark);font-size:23px;font-weight:700}.customer strong,.customer span{display:block}.customer span,.time span{font-size:12px;color:var(--muted)}.time strong{display:block}.wait-control{display:flex;align-items:center;gap:6px}.wait-control strong{min-width:54px;text-align:center}.actions{display:flex;flex-wrap:wrap;gap:6px}.badge{display:inline-flex;align-items:center;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:700}.badge.waiting{background:#eef0f7;color:#56596b}.badge.called{background:#fff1df;color:var(--warn)}.badge.seated{background:#e8f4ed;color:var(--ok)}.badge.cancelled{background:#f5e8e6;color:var(--danger)}.empty{text-align:center;padding:50px 20px;color:var(--muted)}
    dialog{border:0;padding:0;width:min(92vw,430px);box-shadow:var(--shadow)}dialog::backdrop{background:rgba(35,35,35,.62)}.login{padding:30px}.login img{width:78px;background:var(--dark);padding:10px;float:right}.login h2{margin:0 0 6px}.login p{font-size:14px;color:var(--muted);margin:0 0 24px}.login input{width:100%;padding:12px;border:1px solid var(--line);margin-bottom:12px}.login .error{color:var(--danger);font-size:13px;min-height:20px}.toast{position:fixed;right:24px;bottom:24px;background:var(--dark);color:#fff;padding:12px 16px;border-radius:4px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
    @media(max-width:760px){header{align-items:flex-start}.sync{display:none}.toolbar{align-items:flex-start;flex-direction:column}.toolbar h1{font-size:27px}.stats{grid-template-columns:1fr 1fr}.settings{align-items:stretch}.field{flex:1 1 140px}.field input,.field select{width:100%}.settings .button{width:100%}}
  </style>
</head>
<body>
  <header><div class="identity"><img src="logo/260907_qing_logo.svg" alt="慶壽喜燒"><div><strong>候位管理後台</strong><span>Qing Sukiyaki</span></div></div><div class="header-actions"><span class="sync" id="syncText">尚未同步</span><button class="button light small" id="logoutBtn">登出</button></div></header>
  <main>
    <div class="toolbar"><div><h1>現場候位</h1><p>管理預計入席時間、五分鐘簡訊提醒與叫號狀態。</p></div><button class="button" id="refreshBtn">更新名單</button></div>
    <section class="stats"><div class="stat"><span>等候中</span><strong id="waitingCount">0</strong></div><div class="stat"><span>已叫號</span><strong id="calledCount">0</strong></div><div class="stat"><span>已入席</span><strong id="seatedCount">0</strong></div><div class="stat"><span>今日總取號</span><strong id="totalCount">0</strong></div></section>
    <form class="settings" id="settingsForm"><div class="field"><label for="defaultWait">新取號預設等候（分鐘）</label><input id="defaultWait" type="number" min="0" max="600" required></div><div class="field"><label for="avgMinutes">每組平均（分鐘）</label><input id="avgMinutes" type="number" min="1" max="120" required></div><div class="field"><label for="currentNumber">目前叫號</label><input id="currentNumber" maxlength="5" pattern="[A-Za-z][0-9]{3,4}" required></div><button class="button" type="submit">儲存設定</button></form>
    <section class="panel"><div class="panel-head"><h2>候位紀錄</h2><div class="field"><select id="statusFilter" aria-label="篩選候位狀態"><option value="active">進行中</option><option value="all">全部紀錄</option><option value="waiting">等候中</option><option value="called">已叫號</option><option value="seated">已入席</option><option value="cancelled">已取消</option></select></div></div><div class="table-wrap"><table><thead><tr><th>號碼</th><th>顧客</th><th>取號／預計入席</th><th>等候時間</th><th>提醒</th><th>狀態</th><th>操作</th></tr></thead><tbody id="queueBody"></tbody></table><div class="empty" id="emptyState">目前沒有候位資料</div></div></section>
  </main>
  <dialog id="loginDialog"><form class="login" id="loginForm"><img src="logo/260907_qing_logo.svg" alt=""><h2>管理員登入</h2><p>請輸入後台密碼以查看顧客候位資料。</p><label class="field" for="adminKey">後台密碼</label><input id="adminKey" type="password" autocomplete="current-password" required><div class="error" id="loginError"></div><button class="button" type="submit" style="width:100%">登入</button></form></dialog>
  <div class="toast" id="toast"></div>
  <script>
    const $=s=>document.querySelector(s);let adminKey=sessionStorage.getItem("qing-admin-key")||"";let tickets=[];let stats={waiting:0,called:0,seated:0,todayTotal:0};let busy=false;
    const statusLabels={waiting:"等候中",called:"已叫號",seated:"已入席",cancelled:"已取消"};
    const time=v=>v?new Date(v).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false}):"—";
    const dateTime=v=>v?new Date(v).toLocaleString("zh-TW",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}):"—";
    const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    function toast(message){const el=$("#toast");el.textContent=message;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2300)}
    async function api(path,options={}){const res=await fetch(`/api/admin${path}`,{...options,headers:{"Content-Type":"application/json","X-Admin-Key":adminKey,...(options.headers||{})}});const body=await res.json().catch(()=>({}));if(res.status===401){sessionStorage.removeItem("qing-admin-key");adminKey="";$("#loginDialog").showModal()}if(!res.ok)throw new Error(body.message||"操作失敗");return body}
    function reminderText(t){if(t.reminderSentAt)return `已於 ${time(t.reminderSentAt)} 發送`;if(t.reminderError)return `失敗：${t.reminderError}`;return "等待五分鐘提醒"}
    function render(){const tbody=$("#queueBody");tbody.innerHTML="";$("#emptyState").style.display=tickets.length?"none":"block";for(const t of tickets){const active=t.status==="waiting";const called=t.status==="called";const tr=document.createElement("tr");tr.innerHTML=`<td><span class="ticket">${esc(t.number)}</span></td><td class="customer"><strong>${esc(t.name)}</strong><span>${esc(t.phone)}</span></td><td class="time"><strong>${dateTime(t.joinedAt)}</strong><span>預計 ${time(t.estimatedEntryAt)}${t.calledAt?`・叫號 ${time(t.calledAt)}`:""}</span></td><td><div class="wait-control">${active?`<button class="button ghost small" data-action="adjust" data-id="${t.id}" data-delta="-5">−5</button>`:""}<strong>${t.estimatedMinutes} 分</strong>${active?`<button class="button ghost small" data-action="adjust" data-id="${t.id}" data-delta="5">+5</button>`:""}</div></td><td>${esc(reminderText(t))}</td><td><span class="badge ${esc(t.status)}">${esc(statusLabels[t.status]||t.status)}</span></td><td><div class="actions">${active?`<button class="button ghost small" data-action="remind" data-id="${t.id}">發提醒</button><button class="button small" data-action="call" data-id="${t.id}">叫號入席</button>`:""}${called?`<button class="button small" data-action="complete" data-id="${t.id}">完成入席</button>`:""}</div></td>`;tbody.appendChild(tr)}
      $("#waitingCount").textContent=stats.waiting;$("#calledCount").textContent=stats.called;$("#seatedCount").textContent=stats.seated;$("#totalCount").textContent=stats.todayTotal;
    }
    async function load(){if(!adminKey)return $("#loginDialog").showModal();try{const data=await api(`/queue?status=${encodeURIComponent($("#statusFilter").value)}`);tickets=data.tickets;stats=data.stats;$("#defaultWait").value=data.settings.defaultWaitMinutes;$("#avgMinutes").value=data.settings.avgMinutesPerGroup;$("#currentNumber").value=data.settings.currentNumber;$("#syncText").textContent=`更新於 ${time(data.checkedAt)}`;render()}catch(e){if(adminKey)toast(e.message)}}
    async function act(action,id,delta){if(busy)return;busy=true;try{const t=tickets.find(x=>x.id===id);let result;if(action==="adjust")result=await api(`/queue/${id}`,{method:"PATCH",body:JSON.stringify({estimatedMinutes:Math.max(0,t.estimatedMinutes+Number(delta))})});else result=await api(`/queue/${id}/${action}`,{method:"POST"});toast(action==="adjust"?"等候時間已調整":action==="remind"?"提醒簡訊已送出":action==="call"?(result.callMessageError?`已叫號，但簡訊失敗：${result.callMessageError}`:"已叫號並發送入席通知"):"已完成入席");await load()}catch(e){toast(e.message)}finally{busy=false}}
    $("#queueBody").addEventListener("click",e=>{const b=e.target.closest("button[data-action]");if(b)act(b.dataset.action,b.dataset.id,b.dataset.delta)});
    $("#settingsForm").addEventListener("submit",async e=>{e.preventDefault();try{await api("/settings",{method:"PATCH",body:JSON.stringify({defaultWaitMinutes:Number($("#defaultWait").value),avgMinutesPerGroup:Number($("#avgMinutes").value),currentNumber:$("#currentNumber").value})});toast("候位設定已儲存");await load()}catch(err){toast(err.message)}});
    $("#loginForm").addEventListener("submit",async e=>{e.preventDefault();adminKey=$("#adminKey").value;try{await api("/settings");sessionStorage.setItem("qing-admin-key",adminKey);$("#loginError").textContent="";$("#loginDialog").close();await load()}catch(err){$("#loginError").textContent=err.message}});
    $("#logoutBtn").addEventListener("click",()=>{sessionStorage.removeItem("qing-admin-key");adminKey="";$("#adminKey").value="";$("#loginDialog").showModal()});$("#refreshBtn").addEventListener("click",load);$("#statusFilter").addEventListener("change",load);
    load();setInterval(()=>{if(adminKey&&!document.hidden)load()},15000);
  </script>
</body>
</html>
